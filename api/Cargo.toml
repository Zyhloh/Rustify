[package]
name = "api"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws", "macros"] }
dirs = "7.0.0"
futures = "0.3.34"
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
protobuf = "3.7"
reqwest = { version = "0.13.5", features = ["json", "stream", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tao = "0.37"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
