<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rustify</title>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const send = msg => window.ipc.postMessage(JSON.stringify(msg));
const waiters = [];
let player = null;

function push(s) {
  if (!s) {
    send({ type: "state", state: null });
    return;
  }
  const t = s.track_window && s.track_window.current_track;
  describe(s, t);
  send({
    type: "state",
    state: {
      paused: s.paused,
      position: s.position,
      shuffle: s.shuffle,
      repeat: s.repeat_mode,
      context: s.context && s.context.uri,
      track: t && {
        id: t.id,
        uri: t.uri,
        name: t.name,
        duration: t.duration_ms,
        artists: (t.artists || []).map(a => ({ name: a.name, uri: a.uri })),
        album: t.album && { name: t.album.name, uri: t.album.uri, images: t.album.images || [] },
      },
    },
  });
}

function describe(s, t) {
  if (!("mediaSession" in navigator) || external.active) return;
  try {
    if (t) {
      const images = ((t.album && t.album.images) || []).filter(i => i && i.url);
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.name || "",
        artist: (t.artists || []).map(a => a.name).join(", "),
        album: (t.album && t.album.name) || "",
        artwork: images.map(i => ({ src: i.url })),
      });
      document.title = `${t.name} • ${(t.artists || []).map(a => a.name).join(", ")}`;
    }
    navigator.mediaSession.playbackState = s.paused ? "paused" : "playing";
  } catch (e) {
    send({ type: "error", kind: "media_session", message: String(e) });
  }
}

function bindMediaKeys() {
  if (!("mediaSession" in navigator)) return;
  const actions = {
    play: () => (external.active ? external.play() : player.resume()),
    pause: () => (external.active ? external.pause() : player.pause()),
    nexttrack: () => (external.active ? send({ type: "external", event: "next" }) : player.nextTrack()),
    previoustrack: () => (external.active ? send({ type: "external", event: "previous" }) : player.previousTrack()),
    seekto: d => (external.active ? external.seek(d.seekTime * 1000) : player.seek(Math.round(d.seekTime * 1000))),
  };
  for (const [action, run] of Object.entries(actions)) {
    try {
      navigator.mediaSession.setActionHandler(action, d => (external.active || player) && Promise.resolve(run(d)).catch(() => {}));
    } catch (_) {}
  }
}

const external = (() => {
  let audio = null;
  let active = false;
  let last = 0;
  let pending = null;
  let level = 0.7;
  const report = force => {
    if (!active || !audio) return;
    const now = Date.now();
    if (!force && now - last < 900) return;
    last = now;
    send({
      type: "external",
      event: "state",
      paused: audio.paused,
      position: Math.round((audio.currentTime || 0) * 1000),
      duration: isFinite(audio.duration) ? Math.round(audio.duration * 1000) : 0,
    });
  };
  const make = cors => {
    const el = new Audio();
    el.preload = "auto";
    if (cors) el.crossOrigin = "anonymous";
    else el.__rustify = true;
    for (const e of ["play", "pause", "loadedmetadata", "seeked"]) el.addEventListener(e, () => el === audio && report(true));
    el.addEventListener("timeupdate", () => el === audio && report(false));
    el.addEventListener("ended", () => {
      if (el !== audio) return;
      report(true);
      send({ type: "external", event: "ended" });
    });
    el.addEventListener("error", () => {
      if (el !== audio || !active) return;
      if (cors && pending) {
        const retry = pending;
        pending = null;
        start(false, retry);
        return;
      }
      const code = el.error ? el.error.code : 0;
      send({ type: "external", event: "error", message: ["", "aborted", "network error", "can't decode this audio", "unsupported audio or address"][code] || "playback failed" });
    });
    el.addEventListener("playing", () => el === audio && (pending = null));
    return el;
  };
  const start = (cors, job) => {
    if (audio) {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
    }
    const el = make(cors);
    audio = el;
    pending = cors ? job : null;
    el.src = job.src;
    el.volume = level;
    if (job.start > 0) el.currentTime = job.start / 1000;
    el.play().catch(e => {
      if (el !== audio || (cors && pending)) return;
      if (e && e.name === "AbortError") return;
      send({ type: "external", event: "error", message: String((e && e.message) || e) });
    });
  };
  return {
    load(src, meta, startMs, volume) {
      active = true;
      level = Math.max(0, Math.min(1, volume));
      if (player) Promise.resolve(player.getCurrentState()).then(s => s && !s.paused && player.pause()).catch(() => {});
      start(true, { src, start: startMs });
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: meta.title || "", artist: meta.artist || "", album: meta.album || "", artwork: meta.image ? [{ src: meta.image }] : [] });
      } catch (_) {}
    },
    play() { if (active && audio) audio.play().catch(() => {}); },
    pause() { if (active && audio) audio.pause(); },
    toggle() { if (active && audio) (audio.paused ? audio.play().catch(() => {}) : audio.pause()); },
    seek(ms) { if (active && audio) audio.currentTime = Math.max(0, ms) / 1000; },
    volume(v) {
      level = Math.max(0, Math.min(1, v));
      if (audio) audio.volume = level;
    },
    stop() {
      active = false;
      pending = null;
      if (audio) {
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
      }
    },
    get active() { return active; },
  };
})();

window.rustifyExternal = external;

window.rustify = {
  token(t) {
    waiters.splice(0).forEach(cb => cb(t));
  },
  call(method, ...args) {
    if (!player) return;
    Promise.resolve(player[method](...args)).catch(e => send({ type: "error", kind: "call", message: String(e) }));
  },
};

window.onSpotifyWebPlaybackSDKReady = () => {
  player = new Spotify.Player({
    name: params.get("name") || "Rustify",
    getOAuthToken: cb => {
      waiters.push(cb);
      send({ type: "token" });
    },
    volume: Number(params.get("volume") || 0.7),
  });

  for (const kind of ["initialization_error", "authentication_error", "account_error", "playback_error"]) {
    player.addListener(kind, e => send({ type: "error", kind, message: e && e.message }));
  }
  player.addListener("autoplay_failed", () => send({ type: "error", kind: "autoplay_failed", message: "autoplay blocked" }));
  player.addListener("ready", ({ device_id }) => send({ type: "ready", device_id }));
  player.addListener("not_ready", ({ device_id }) => send({ type: "not_ready", device_id }));
  player.addListener("player_state_changed", push);
  bindMediaKeys();

  setInterval(async () => {
    const s = await player.getCurrentState();
    if (s && !s.paused) push(s);
  }, 5000);

  player.connect().then(ok => {
    if (!ok) send({ type: "error", kind: "connect", message: "could not connect the player" });
  });
};
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
