[package]
name = "client"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
dirs = "7.0.0"
futures-util = "0.3.34"
image = "0.25.10"
rquickjs = { version = "0.14", features = ["futures"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2", "unstable-winit-030"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.25"
winreg = "0.56.0"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
rfd = "0.18.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"
slint-build = "1.18.1"

[features]
dev = ["slint/live-preview"]
