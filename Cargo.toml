[workspace]
resolver = "3"
members = ["api", "client"]

[workspace.package]
edition = "2024"
version = "1.2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
